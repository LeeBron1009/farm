<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>我的3D開心農場</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#8fd3ff}
#c{position:fixed;left:0;top:0;width:100%;touch-action:none;display:block}
.ui{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:5}
#top{top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#5fcf5f,#3da63d);color:#fff;font-weight:bold;border-radius:0 0 16px 16px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#top .av{font-size:26px;background:#fff;border-radius:50%;width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center}
#lvbox{flex:1;font-size:14px;min-width:0}
#bar{height:10px;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden;margin-top:3px}
#barin{height:100%;background:#ffd54f;width:0;transition:.3s}
.coin{background:rgba(0,0,0,.3);padding:4px 10px;border-radius:14px;white-space:nowrap}
#nb{background:rgba(255,255,255,.25);padding:4px 8px;border-radius:12px}
#toast{position:fixed;top:128px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:6px 14px;border-radius:16px;font-size:14px;z-index:20;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1}
#seeds{top:62px;display:flex;gap:6px;padding:6px 8px;overflow-x:auto}
.chip{flex:0 0 auto;background:rgba(255,255,255,.88);border-radius:12px;padding:3px 8px;text-align:center;font-size:11px;border:3px solid transparent;min-width:54px}
.chip b{font-size:22px;display:block}
.chip.sel{border-color:#ff9800;background:#fff}
.chip.lock{opacity:.5}
#tools{bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:linear-gradient(#c68a4a,#8a5a2b);border-radius:16px 16px 0 0;box-shadow:0 -3px 8px rgba(0,0,0,.35)}
.tb{background:#fff3d6;border:3px solid #e0b36a;border-radius:12px;padding:3px 0;text-align:center;font-size:11px;color:#5a3a1c;font-weight:bold}
.tb b{display:block;font-size:22px}
.tb.on{background:#ffd54f;border-color:#ff9800;transform:translateY(-3px)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.open{display:flex}
.sheet{background:#fff8e6;width:100%;max-width:520px;max-height:75vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px}
.sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row .ic{font-size:30px}.row .tx{flex:1;font-size:13px}
button{font-size:14px;padding:6px 10px;border:0;border-radius:8px;background:#ff9800;color:#fff;font-weight:bold}
button.g{background:#43a047}button.r{background:#e53935}button:disabled{background:#bbb}
.pop{position:fixed;font-weight:bold;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;font-size:18px;pointer-events:none;animation:pp 1s forwards;z-index:40}
@keyframes pp{to{transform:translateY(-60px);opacity:0}}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;color:#fff;font-size:12px;text-shadow:0 0 4px #000;pointer-events:none;z-index:4;opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="ui">
  <div class="av">🧑‍🌾</div>
  <div id="lvbox">等級 <span id="lv">1</span><div id="bar"><div id="barin"></div></div></div>
  <div class="coin">💰 <span id="coin">0</span></div>
  <div id="nb" onpointerdown="toggleNight()">☀️</div>
</div>
<div id="toast"></div>
<div id="seeds" class="ui"></div>
<div class="hint">拖曳旋轉 · 雙指縮放 · 點土地操作</div>
<div id="tools" class="ui"></div>
<div id="modal" onpointerdown="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ================= 遊戲資料 ================= */
const CROPS=[
 {name:"蘿蔔",icon:"🥕",cost:5,sell:12,time:15,xp:2,lv:1},
 {name:"番茄",icon:"🍅",cost:15,sell:36,time:40,xp:5,lv:2},
 {name:"玉米",icon:"🌽",cost:30,sell:80,time:90,xp:10,lv:3},
 {name:"草莓",icon:"🍓",cost:50,sell:140,time:150,xp:15,lv:4},
 {name:"西瓜",icon:"🍉",cost:80,sell:230,time:240,xp:25,lv:5},
 {name:"南瓜",icon:"🎃",cost:150,sell:450,time:400,xp:40,lv:7},
 {name:"向日葵",icon:"🌻",cost:250,sell:700,time:600,xp:60,lv:9}
];
const ANI=[
 {name:"小雞",icon:"🐔",prod:"🥚",pname:"雞蛋",cost:100,feed:10,time:40,sell:25,lv:1},
 {name:"乳牛",icon:"🐄",prod:"🥛",pname:"牛奶",cost:500,feed:30,time:90,sell:70,lv:3},
 {name:"綿羊",icon:"🐑",prod:"🧶",pname:"羊毛",cost:1200,feed:60,time:150,sell:150,lv:5}
];
const REC=[
 {name:"蔬菜湯",icon:"🍲",need:{c0:2,c1:1},sell:100,time:30,lv:2},
 {name:"玉米濃湯",icon:"🥣",need:{c2:3},sell:340,time:60,lv:3},
 {name:"草莓奶茶",icon:"🧋",need:{c3:2,a1:1},sell:480,time:90,lv:5},
 {name:"南瓜派",icon:"🥧",need:{c5:2,a0:1},sell:1400,time:150,lv:7}
];
const ACH=[
 {id:"h1",name:"初出茅廬",desc:"收成 20 次",v:s=>s.harvest,goal:20,coin:100},
 {id:"h2",name:"農場老手",desc:"收成 100 次",v:s=>s.harvest,goal:100,coin:500},
 {id:"h3",name:"豐收大王",desc:"收成 500 次",v:s=>s.harvest,goal:500,coin:3000},
 {id:"o1",name:"送貨達人",desc:"完成 10 張訂單",v:s=>s.orders,goal:10,coin:400},
 {id:"c1",name:"小廚師",desc:"製作 5 個加工品",v:s=>s.crafted,goal:5,coin:400},
 {id:"a1",name:"牧場主人",desc:"收取動物產品 20 次",v:s=>s.collect,goal:20,coin:300},
 {id:"l1",name:"農場達人",desc:"等級達到 5",v:()=>level(),goal:5,coin:600},
 {id:"f1",name:"大地主",desc:"開墾全部 16 塊土地",v:()=>S.plots.filter(p=>p.open).length,goal:16,coin:1500}
];
function item(id){
  const n=+id.slice(1);
  if(id[0]=="c"){const c=CROPS[n];return{name:c.name,icon:c.icon,sell:c.sell}}
  if(id[0]=="a"){const a=ANI[n];return{name:a.pname,icon:a.prod,sell:a.sell}}
  const r=REC[n];return{name:r.name,icon:r.icon,sell:r.sell};
}

/* ================= 存檔 ================= */
const KEY="happyFarm3D";
const def=()=>({coin:50,xp:0,sel:0,tool:"hand",fert:2,seeds:{},inv:{},animals:[],orders:[],daily:"",
 mill:{r:-1,t:0},scare:false,night:null,ach:{},stats:{harvest:0,crafted:0,orders:0,collect:0},
 plots:Array.from({length:16},(_,i)=>({open:[5,6,9,10,7,11].includes(i)}))});
let S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||"{}"));
S.stats=Object.assign(def().stats,S.stats);
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const level=()=>{let l=1;while(S.xp>=l*l*20)l++;return l};
let modal=null,tt,raining=0;
function msg(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1700)}
function pop(t,e){const d=document.createElement("div");d.className="pop";d.textContent=t;d.style.left=((e&&e.clientX)||200)-30+"px";d.style.top=((e&&e.clientY)||300)-30+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function addXp(n){const b=level();S.xp+=n;if(level()>b){msg("🎉 升級了!等級 "+level());beep(900,.25)}}
let AC;function beep(f=600,d=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ================= 3D 場景基礎 ================= */
const canvas=$("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,.1,400);
const hemi=new THREE.HemisphereLight(0xffffff,0x88aa66,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1.15);
sun.position.set(9,18,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15,near:1,far:70});
sun.shadow.bias=-0.0005;scene.add(sun);

const mats={};
const M=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.8,flatShading:true}));
function mk(g,c,x=0,y=0,z=0,p){const m=new THREE.Mesh(g,M(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(p)p.add(m);return m}
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const cyl=(a,b,h,s=8)=>new THREE.CylinderGeometry(a,b,h,s);
const sph=(r,w=9,h=7)=>new THREE.SphereGeometry(r,w,h);
const cone=(r,h,s=6)=>new THREE.ConeGeometry(r,h,s);
const tor=(r,t,a=5,b=20)=>new THREE.TorusGeometry(r,t,a,b);

/* 島嶼 */
const world=new THREE.Group();scene.add(world);
mk(box(13.4,.35,17.4),"#7ccf50",0,-.17,0,world);
mk(box(13,1.4,17),"#8d6238",0,-1.05,0,world);
const under=mk(cone(7.2,6,7),"#6d4a2a",0,-4.8,0,world);under.rotation.x=Math.PI;
mk(cone(3,4,6),"#5c3d22",1,-7.5,1,world).rotation.x=Math.PI;

/* 裝飾 */
function tree(x,z,s=1,round=false){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
  mk(cyl(.2,.28,1.2),"#7b5230",0,.6,0,g);
  if(round){mk(sph(.9,9,7),"#4caf50",0,1.8,0,g);mk(sph(.65,9,7),"#66bb6a",.4,2.4,.2,g)}
  else{mk(cone(1,1.4,7),"#2e9e4a",0,1.7,0,g);mk(cone(.8,1.2,7),"#3cb55a",0,2.5,0,g);mk(cone(.55,1,7),"#4cc66a",0,3.2,0,g)}
  world.add(g);
}
tree(-5.8,-3,1);tree(5.8,-2,1.1,true);tree(-5.9,1.5,.9,true);tree(5.7,-5.5,1);tree(-5.6,-6.2,1.1);tree(5.9,2.2,.9);

const house=new THREE.Group();house.position.set(3.6,0,-7.2);world.add(house);
mk(box(2.6,1.7,2.1),"#f5e6c8",0,.85,0,house);
const roof=mk(cone(2.1,1.3,4),"#d9534f",0,2.3,0,house);roof.rotation.y=Math.PI/4;
mk(box(.55,1,.1),"#7b5230",0,.5,1.06,house);
mk(box(.5,.5,.1),"#81d4fa",-.85,1,1.06,house);mk(box(.5,.5,.1),"#81d4fa",.85,1,1.06,house);
mk(box(.35,.8,.35),"#a1887f",.8,2.6,-.3,house);

const windmill=new THREE.Group();windmill.position.set(-1,0,-7.4);world.add(windmill);
mk(cyl(.55,.9,2.8,8),"#f3e9d2",0,1.4,0,windmill);
mk(cone(.7,.9,8),"#c0392b",0,3.2,0,windmill);
const blades=new THREE.Group();blades.position.set(0,2.7,.8);windmill.add(blades);
for(let k=0;k<4;k++){const b=mk(box(.28,1.7,.06),"#fff",0,.9,0,new THREE.Group());b.parent.rotation.z=k*Math.PI/2;blades.add(b.parent)}
mk(sph(.14),"#795548",0,2.7,.8,windmill);

const mill=new THREE.Group();mill.position.set(-4.5,0,-6.9);mill.userData={kind:"mill"};world.add(mill);
mk(box(2.4,1.5,2),"#c98a4b",0,.75,0,mill);
mk(box(2.7,.25,2.3),"#5d4037",0,1.62,0,mill);
mk(box(.5,1,.5),"#8d6e63",.7,2.2,-.4,mill);
mk(box(.9,.7,.1),"#ffe082",0,.9,1.02,mill);
const millLab=label();millLab.sprite.position.set(0,3.4,0);mill.add(millLab.sprite);

const scare=new THREE.Group();scare.position.set(5.2,0,3.4);world.add(scare);
mk(cyl(.06,.06,2),"#7b5230",0,1,0,scare);
mk(box(1.4,.08,.08),"#7b5230",0,1.5,0,scare);
mk(sph(.28),"#ffe0b2",0,2.15,0,scare);
mk(cone(.4,.35,8),"#795548",0,2.5,0,scare);
mk(box(.9,.8,.05),"#e53935",0,1.2,0,scare);

/* 牧場 */
mk(box(10.8,.06,3.4),"#e8cf8a",0,.03,6.2,world).castShadow=false;
for(let k=0;k<=8;k++){const x=-5.2+k*1.3;mk(box(.14,.8,.14),"#a1744a",x,.4,7.9,world)}
mk(box(10.6,.09,.07),"#c8955a",0,.65,7.9,world);mk(box(10.6,.09,.07),"#c8955a",0,.35,7.9,world);
[-5.2,5.2].forEach(x=>{for(let k=0;k<3;k++)mk(box(.14,.8,.14),"#a1744a",x,.4,4.8+k*1.45,world);
  mk(box(.07,.09,3.1),"#c8955a",x,.65,6.3,world)});

/* 花 */
const fc=["#ff6f91","#ffd54f","#ffffff","#ba68c8","#ff8a65"];
for(let k=0;k<34;k++){
  const x=(Math.random()<.5?-1:1)*(5.9+Math.random()*.4),z=-8+Math.random()*12;
  mk(cyl(.02,.02,.3,4),"#3f8f3f",x,.15,z,world);mk(sph(.1,6,5),fc[k%5],x,.34,z,world);
}

/* 雲 */
const clouds=[];
for(let k=0;k<9;k++){
  const g=new THREE.Group();
  for(let j=0;j<4;j++){const s=mk(sph(1+Math.random()*.8,8,6),"#ffffff",j*1.2-1.8,Math.random()*.4,Math.random()*.6,g);s.castShadow=false;s.receiveShadow=false}
  g.position.set(-60+Math.random()*120,-8+Math.random()*22,-40-Math.random()*40+(k%2?60:0));
  g.userData.sp=.4+Math.random()*.6;scene.add(g);clouds.push(g);
}
/* 星星、雨 */
const sp=new Float32Array(900);
for(let k=0;k<300;k++){const a=Math.random()*6.28,b=Math.random()*1.3+.1,r=140;sp[k*3]=Math.cos(a)*Math.cos(b)*r;sp[k*3+1]=Math.sin(b)*r;sp[k*3+2]=Math.sin(a)*Math.cos(b)*r}
const starG=new THREE.BufferGeometry();starG.setAttribute("position",new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(starG,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false}));scene.add(stars);
const rp=new Float32Array(1500);
for(let k=0;k<500;k++){rp[k*3]=(Math.random()-.5)*20;rp[k*3+1]=Math.random()*14;rp[k*3+2]=(Math.random()-.5)*20}
const rainG=new THREE.BufferGeometry();rainG.setAttribute("position",new THREE.BufferAttribute(rp,3));
const rain=new THREE.Points(rainG,new THREE.PointsMaterial({color:0xa5d8ff,size:2,sizeAttenuation:false}));rain.visible=false;scene.add(rain);

/* 白天/夜晚 */
function isNight(){if(S.night!=null)return S.night;const h=new Date().getHours();return h>=18||h<6}
function applyTime(){
  const n=isNight(),bg=n?0x0b1535:0x8fd3ff;
  scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,80,200);
  hemi.color.set(n?0x7788bb:0xffffff);hemi.groundColor.set(n?0x223322:0x88aa66);hemi.intensity=n?.6:.95;
  sun.color.set(n?0x9fb4ff:0xfff2d0);sun.intensity=n?.7:1.15;
  stars.visible=n;$("nb").textContent=n?"🌙":"☀️";document.body.style.background=n?"#0b1535":"#8fd3ff";
}
window.toggleNight=()=>{S.night=!isNight();save();applyTime()};

/* ================= 標籤 ================= */
function label(){
  const cv=document.createElement("canvas");cv.width=256;cv.height=96;const x=cv.getContext("2d");
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  s.scale.set(2.3,.86,1);s.renderOrder=10;s.raycast=()=>{};s.visible=false;
  let last=null;
  return{sprite:s,set(t){
    if(t===last)return;last=t;s.visible=!!t;if(!t)return;
    x.clearRect(0,0,256,96);x.fillStyle="rgba(0,0,0,.68)";
    x.beginPath();const r=30,X=8,Y=12,W=240,H=72;
    x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();x.fill();
    x.fillStyle="#fff";x.font="bold 36px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(t,128,50);
    tex.needsUpdate=true;
  }};
}

/* ================= 作物模型 ================= */
const CB=[
 g=>{const o=mk(cone(.28,.85,8),"#ff8f1f",0,.2,0,g);o.rotation.x=Math.PI;
  for(let k=0;k<5;k++){const a=k/5*6.28,l=mk(cone(.12,.8,5),"#43a047",Math.cos(a)*.15,.85,Math.sin(a)*.15,g);l.rotation.z=-Math.cos(a)*.5;l.rotation.x=Math.sin(a)*.5}},
 g=>{mk(cyl(.05,.07,1.1),"#6a9a3a",0,.55,0,g);
  for(let k=0;k<4;k++){const a=k*1.6,l=mk(sph(.3,7,6),"#3f9a3c",Math.cos(a)*.35,.55+k*.15,Math.sin(a)*.35,g);l.scale.set(1,.4,1)}
  [[.3,.45,.1],[-.25,.7,.2],[.05,.95,-.3],[.1,.3,.35]].forEach(p=>mk(sph(.22,9,8),"#e53935",p[0],p[1],p[2],g))},
 g=>{mk(cyl(.08,.1,1.9),"#7cb342",0,.95,0,g);
  for(let k=0;k<5;k++){const a=k*1.3,l=mk(box(.9,.04,.22),"#558b2f",Math.cos(a)*.4,.5+k*.3,Math.sin(a)*.4,g);l.rotation.y=-a;l.rotation.z=.4}
  mk(cyl(.14,.16,.65),"#ffd54f",.2,1.2,0,g);mk(cone(.18,.4,6),"#8bc34a",.2,1.65,0,g)},
 g=>{for(let k=0;k<5;k++){const a=k*1.25,l=mk(sph(.3,7,6),"#43a047",Math.cos(a)*.3,.3+k*.04,Math.sin(a)*.3,g);l.scale.set(1,.4,1)}
  [[.35,.25,.2],[-.3,.22,.25],[0,.2,-.35],[.1,.5,0],[-.2,.3,-.2]].forEach(p=>{const b=mk(cone(.14,.3,7),"#e53946",p[0],p[1],p[2],g);b.rotation.x=Math.PI})},
 g=>{const w=new THREE.Group();w.position.y=.5;w.scale.set(1.15,.9,1);g.add(w);
  mk(sph(.6,12,10),"#43a047",0,0,0,w);for(let k=0;k<4;k++){const t=mk(tor(.6,.035,5,20),"#1b6b2a",0,0,0,w);t.rotation.y=k*Math.PI/4}
  mk(cyl(.05,.06,.2),"#5d4037",0,.58,0,w)},
 g=>{const p=new THREE.Group();p.position.y=.45;p.scale.set(1.15,.8,1.15);g.add(p);
  mk(sph(.55,12,10),"#ff8a1f",0,0,0,p);for(let k=0;k<3;k++){const t=mk(tor(.55,.05,5,20),"#f06d00",0,0,0,p);t.rotation.y=k*Math.PI/3}
  mk(cyl(.07,.09,.28),"#5d4037",0,.62,0,g)},

function prog(p){const c=CROPS[p.c],full=c.time*1000,half=full*.4;let el=Date.now()-p.t;if(!p.wet&&el>half)el=half;return Math.min(1,el/full)}
function needWater(p){return !p.wet&&Date.now()-p.t>=CROPS[p.c].time*400}
function waterPlot(p){if(p.wet)return;const half=CROPS[p.c].time*400,stall=Math.max(0,Date.now()-(p.t+half));p.t+=stall;p.wet=true}
const plotCost=()=>100*(S.plots.filter(x=>x.open).length-5);

const parts=[],pg=new THREE.SphereGeometry(.09,6,5);
function burst(pos,color,n=10,up=4){
  for(let k=0;k<n;k++){const m=new THREE.Mesh(pg,M(color));m.position.copy(pos);m.position.y+=.5;scene.add(m);
    parts.push({m,v:new THREE.Vector3((Math.random()-.5)*3,Math.random()*up,(Math.random()-.5)*3),life:.9})}
}
const wp=i=>PV[i].g.getWorldPosition(new THREE.Vector3());

function tap(i,e){
  const p=S.plots[i];
  if(!p.open){
    const cost=plotCost();
    if(S.coin<cost)return msg("開墾需要 "+cost+"💰");
    S.coin-=cost;p.open=true;msg("開墾成功!");beep(500);burst(wp(i),"#8d6238",14);
  }else if(S.tool=="hand"){
    if(p.c==null){
      const c=CROPS[S.sel];
      if(level()<c.lv)return msg("等級不夠");
      if((S.seeds[S.sel]||0)>0)S.seeds[S.sel]--;
      else if(S.coin>=c.cost)S.coin-=c.cost;
      else return msg("金幣不足");
      S.plots[i]={open:true,c:S.sel,t:Date.now(),wet:false,bug:Math.random()<(S.scare?.1:.3),fert:false};
      pop("🌱",e);beep(520);burst(wp(i),"#6d4c2a",8);
    }else{
      const c=CROPS[p.c];
      if(prog(p)<1){
        if(needWater(p))return msg("💧 需要澆水才能繼續長大");
        return msg(c.name+"還要 "+Math.ceil((1-prog(p))*c.time)+" 秒");
      }
      if(p.bug)return msg("🐛 先除蟲才能收成");
      S.inv["c"+p.c]=(S.inv["c"+p.c]||0)+1;S.stats.harvest++;addXp(c.xp);
      S.plots[i]={open:true};pop("+1"+c.icon+" +"+c.xp+"XP",e);beep(780);burst(wp(i),"#ffd54f",14,5);
    }
  }else if(p.c!=null){
    if(S.tool=="water"){if(p.wet)return msg("已經澆過水了");waterPlot(p);pop("💧",e);beep(400);
      const q=wp(i);q.y+=1.8;burst(q,"#4fc3f7",14,0)}
    else if(S.tool=="bug"){if(!p.bug)return msg("沒有蟲");p.bug=false;addXp(1);pop("✨除蟲 +1XP",e);beep(700);burst(wp(i),"#76c13a",10)}
    else if(S.tool=="fert"){
      if(prog(p)>=1)return msg("已經成熟了");
      if(p.fert)return msg("已經施過肥");
      if(S.fert<1)return msg("沒有肥料,去商店買");
      S.fert--;p.fert=true;p.t-=CROPS[p.c].time*300;pop("🧪 加速!",e);beep(650);burst(wp(i),"#b388ff",12,5)}
  }
  save();draw();
}
function tapAn(i,e){

window.craft=r=>{

  if(S.mill.r>=0)return msg("工坊正在忙");

  for(const k in d.need)if((S.inv[k]||0)<d.need[k])return msg("材料不足");

/* 同步 3D 畫面 */
function syncPlot(i){
  const p=S.plots[i],v=PV[i];let key,txt=null;
  if(!p.open){key="L";txt="🔒 "+plotCost()+"💰"}
  else if(p.c==null)key="E";
  else{const pr=prog(p),st=pr>=1?2:pr<.3?0:1;key=`C${p.c}_${st}_${p.bug?1:0}`;v.stage=st;
    txt=st==2?(p.bug?"🐛 需除蟲":"✨ 可收成"):needWater(p)?"💧 缺水":Math.ceil((1-pr)*CROPS[p.c].time)+"秒"}
  v.tile.material=!p.open?M("#8fdc63"):(p.c!=null&&p.wet)?M("#6e4120"):M("#a8692f");
  v.tile.scale.y=p.open?1:.35;v.fur.visible=p.open;
  if(key!==v.key){
    v.key=key;while(v.crop.children.length)v.crop.remove(v.crop.children[0]);
    v.model=null;v.bug=null;v.ring=null;
    if(p.open&&p.c!=null){
      const m=new THREE.Group();v.crop.add(m);v.model=m;
      if(v.stage==0)sprout(m);else CB[p.c](m);
      if(v.stage==2){const r=mk(tor(.85,.05,6,28),"#ffd54f",0,.05,0,v.crop);r.rotation.x=Math.PI/2;r.castShadow=false;v.ring=r}
      if(p.bug){v.bug=makeBug();v.crop.add(v.bug)}
    }
  }
  v.lab.set(txt);
}

window.buy=(t,i,cost)=>{
  if(S.coin<cost)return msg("金幣不足");
  if(t=="scare"&&S.scare)return;
  S.coin-=cost;

  beep(600);save();draw();
};

window.buyAn=i=>{
  if(S.animals.length>=6)return msg("牧場已滿");

function fillOrders(){
  const l=level();
  while(S.orders.length<3){
    const pool=[];
    CROPS.forEach((c,i)=>{if(c.lv<=l)pool.push("c"+i)});
    ANI.forEach((a,i)=>{if(a.lv<=l&&S.animals.some(x=>x.k==i))pool.push("a"+i)});
    REC.forEach((r,i)=>{if(r.lv<=l)pool.push("r"+i)});
    const id=pool[Math.floor(Math.random()*pool.length)],n=id[0]=="r"?1+Math.floor(Math.random()*2):2+Math.floor(Math.random()*4);
    S.orders.push({id,n,coin:Math.round(item(id).sell*n*1.6),xp:n*3});
  }
}

  const o=S.orders[i];if((S.inv[o.id]||0)<o.n)return;
  S.inv[o.id]-=o.n;S.coin+=o.coin;S.stats.orders++;addXp(o.xp);S.orders.splice(i,1);msg("訂單完成 +"+o.coin+"💰");beep(850);save();draw();
};
window.claim=id=>{
  const a=ACH.find(x=>x.id===id);
  if(!a||S.ach[id]||a.v(S.stats)<a.goal)return;
  S.ach[id]=true;S.coin+=a.coin;msg("🏆 成就達成 +"+a.coin+"💰");beep(950,.2);save();draw();
};
window.resetGame=()=>{
  if(confirm("確定要重置整個遊戲嗎?")){localStorage.removeItem(KEY);location.reload()}
};

/* ================= 視角控制 ================= */
let yaw=.6,pitch=.95,zoom=1,baseDist=28;
function resize(){
  const w=innerWidth,h=Math.max(200,innerHeight-$("tools").offsetHeight);
  canvas.style.height=h+"px";
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  baseDist=clamp(20.6/camera.aspect,24,46);
  camera.setViewOffset(w,h,0,-40,w,h);
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize);

const ptrs=new Map();
let down=null,pinch0=0;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  down={x:e.clientX,y:e.clientY,t:Date.now(),moved:0};
  if(ptrs.size==2){
    const [a,b]=[...ptrs.values()];
    pinch0=Math.hypot(a.x-b.x,a.y-b.y);
    down.moved=99;
  }
});
canvas.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size==2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0)zoom=clamp(zoom*pinch0/d,.6,1.5);
    pinch0=d;return;
  }
  if(down)down.moved+=Math.abs(dx)+Math.abs(dy);
  yaw-=dx*.006;
  pitch=clamp(pitch+dy*.004,.55,1.25);
});
canvas.addEventListener("pointerup",e=>{
  ptrs.delete(e.pointerId);
  if(down&&down.moved<10&&Date.now()-down.t<600&&ptrs.size==0)pick(e);
  if(ptrs.size==0)down=null;
  pinch0=0;
});
canvas.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);down=null;pinch0=0});
canvas.addEventListener("wheel",e=>{zoom=clamp(zoom*(1+e.deltaY*.001),.6,1.5)},{passive:true});

/* ================= 點擊 3D 物件 ================= */
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function pick(e){
  const r=canvas.getBoundingClientRect();
  v2.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(v2,camera);
  const hit=ray.intersectObjects(pickables,true)[0];
  if(!hit)return;
  let o=hit.object;
  while(o&&!o.userData.kind)o=o.parent;
  if(!o)return;
  const u=o.userData;
  if(u.kind=="plot")tap(u.i,e);
  else if(u.kind=="animal")tapAn(u.i,e);
  else if(u.kind=="mill")millTap(e);
}

/* ================= 下雨事件 ================= */
setInterval(()=>{
  if(raining<=0&&Math.random()<.25){
    raining=10;
    S.plots.forEach(p=>{if(p.open&&p.c!=null)waterPlot(p)});
    msg("☔ 下雨了!作物自動澆水");
    save();draw();
  }
},30000);

/* ================= 動畫迴圈 ================= */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime;

  const d=baseDist*zoom;
  camera.position.set(
    Math.sin(yaw)*Math.cos(pitch)*d,
    Math.sin(pitch)*d,
    Math.cos(yaw)*Math.cos(pitch)*d
  );
  camera.lookAt(0,0,0);

  clouds.forEach(c=>{
    c.position.x+=c.userData.sp*dt;
    if(c.position.x>70)c.position.x=-70;
  });
  blades.rotation.z+=dt*1.2;

  PV.forEach((v,i)=>{
    if(!v.model)return;
    const p=S.plots[i];
    if(v.stage==1&&p.c!=null){
      const pr=prog(p);
      v.model.scale.setScalar(.4+.6*clamp((pr-.3)/.7,0,1));
    }else if(v.stage==2){
      v.model.scale.setScalar(1);
      v.model.position.y=Math.abs(Math.sin(t*3+i))*.1;
      if(v.ring)v.ring.rotation.z+=dt*2;
    }
    if(v.bug){
      v.bug.rotation.y=Math.sin(t*4)*.5;
      v.bug.position.x=.55+Math.sin(t*2)*.1;
    }
  });

  const now=Date.now();
  S.animals.forEach((a,i)=>{
    const av=AV[i];if(!av)return;
    const dd=ANI[a.k];
    const ready=a.t&&now>=a.t+dd.time*1000;
    av.m.rotation.z=0;
    if(!a.t){
      av.m.rotation.z=Math.sin(t*8)*.05;
      av.g.position.y=0;
    }else if(ready){
      av.g.position.y=Math.abs(Math.sin(t*6))*.3;
    }else{
      av.g.position.y=Math.abs(Math.sin(t*2+i))*.04;
    }
  });

  for(let k=parts.length-1;k>=0;k--){
    const q=parts[k];
    q.v.y-=9*dt;
    q.m.position.addScaledVector(q.v,dt);
    q.life-=dt;
    q.m.scale.setScalar(Math.max(.05,q.life));
    if(q.life<=0){scene.remove(q.m);parts.splice(k,1)}
  }

  if(raining>0){
    raining-=dt;
    rain.visible=true;
    const arr=rainG.attributes.position.array;
    for(let k=0;k<500;k++){
      arr[k*3+1]-=dt*20;
      if(arr[k*3+1]<0)arr[k*3+1]=14;
    }
    rainG.attributes.position.needsUpdate=true;
  }else rain.visible=false;

  renderer.render(scene,camera);
}

/* ================= 啟動 ================= */
const today=new Date().toDateString();
if(S.daily!==today){
  S.daily=today;S.coin+=50;
  setTimeout(()=>msg("🎁 每日登入獎勵 +50💰"),600);
}
applyTime();
syncAnimals();
draw();
resize();
animate();
setInterval(draw,1000);
save();
</script>
